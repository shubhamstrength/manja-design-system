<!doctype html>
<html lang="en">
  <head>
    <!--
      Anti-flash theme script. Must run before the stylesheet is applied, so it
      is inlined here rather than imported.

      This mirrors `themeInitScript()` from @manja/core. The Angular CLI has no
      index-transform hook the way Vite does, so unlike the React playground
      this one copy is maintained by hand — keep the two in step.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('manja-theme');
          if (p === 'light' || p === 'dark')
            document.documentElement.setAttribute('data-mj-theme', p);
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <title>Manja — Angular playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
