name: Deploy React playground to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, plus the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — the action reads the `packageManager`
      # field from package.json, so the pinned pnpm version has one home.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Guards the deploy: a red repo should never reach the published site.
      - name: Verify
        run: pnpm verify

      # Nx builds tokens -> styles/core -> react first via dependsOn ^build.
      # Pages serves a project site from /<repo>/, so every asset URL needs
      # that prefix. Taking the name from the event keeps it correct through a
      # rename or in a fork, and MANJA_BASE_PATH is part of the Nx cache key so
      # a cached root-relative build can never be replayed here.
      - name: Build playground
        env:
          MANJA_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm nx build @manja/react-playground

      # Requires Pages to be enabled once, by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # This action's `enablement: true` option cannot do it for us — creating a
      # Pages site needs repo-admin scope, which the default GITHUB_TOKEN is not
      # granted, so it fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/react-playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
